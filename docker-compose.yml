services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recover}
      POSTGRES_DB: recover
    volumes:
      - recover-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432" # host-side tooling (drizzle-kit, psql); not exposed on LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recover -d recover"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Prebuilt image (amd64/arm64). To build from source instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/crunchynapkin404/recover:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=recover"
    ports:
      - "${APP_PORT:-3000}:3000"
    # Without this, "the container is up" is the only signal anyone has —
    # including watchtower, which pulls a new image, restarts, and reports a
    # successful deploy whether or not the app can serve a request. Observed
    # while building v0.104.0: an app that died on a failed env-validation at
    # boot still read `Up 2 minutes` in `docker ps` while answering nothing at
    # all. Only db had a healthcheck before this.
    #
    # busybox wget ships in the node:22-alpine image. The grep is what makes
    # this a readiness check rather than a liveness one: /api/health answers
    # 200 with "db":"down" when Postgres is unreachable, so matching on the
    # status code alone would call a database-less app healthy.
    #
    # It probes $$(hostname), NOT 127.0.0.1, and that is not a stylistic
    # choice. Next's standalone server binds to process.env.HOSTNAME, which
    # Docker sets to the container ID — so the app listens on the container's
    # own IP and loopback is refused. A 127.0.0.1 probe reports every healthy
    # container as unhealthy; this was caught on the RC soak stack, where the
    # app answered fine through the published port while the check failed with
    # "can't connect to remote host". The doubled $$ escapes compose's own
    # interpolation so the shell expands it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://$$(hostname):3000/api/health | grep -q ''"db":"up"''',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations run at boot (docker-entrypoint.sh), so a cold start with a
      # long migration must not be reported unhealthy while it is working.
      start_period: 60s
    environment:
      # The athlete's timezone. Recover has no per-user timezone field, so the
      # container's local time IS the athlete's wall clock: it decides how bed
      # times, sleep midpoint/chronotype and the recommended bedtime are
      # rendered, and which local hour the sync/brief/backstop slots fire at.
      # Left at UTC a CEST athlete sees "went to bed 21:32" for a 23:32 bedtime.
      # Set TZ in .env to your own zone (e.g. Europe/Amsterdam).
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgres://recover:${POSTGRES_PASSWORD:-recover}@db:5432/recover
      DATABASE_DRIVER: pg
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env — 64 hex chars}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      CRON_SECRET: ${CRON_SECRET:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      BACKUP_NOTIFY_SECRET: ${BACKUP_NOTIFY_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    # Compose normally derives the `app` DNS alias from the service name, but
    # that alias is not part of the container's own config — a recreate
    # performed outside compose (an image auto-updater, a manual `docker run`
    # from a copied config) brings the container back with NO aliases, and
    # `app` stops resolving on the network. That happened on 2026-08-07: the
    # app was healthy on its IP while the Cloudflare tunnel served 502s, and
    # `docker-compose.yml`'s own BACKUP_NOTIFY_URL below points at the same
    # name, so backup notifications would have failed silently too. Declaring
    # the alias explicitly makes it part of the service definition, so any
    # compose-driven recreate restores it.
    networks:
      default:
        aliases:
          - app

  # Nightly pg_dump to the recover-backups volume, 14-dump rotation.
  # Deliberately default-on (no profile): forgetting a profile flag must
  # not mean having no backups. Drill: scripts/restore-drill.sh
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: recover
      PGPASSWORD: ${POSTGRES_PASSWORD:-recover}
      PGDATABASE: recover
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Reports backup freshness to the app after a successful rotate
      # (scripts/backup.sh); same shared secret the app verifies against.
      BACKUP_NOTIFY_SECRET: ${BACKUP_NOTIFY_SECRET:-}
      BACKUP_NOTIFY_URL: http://app:3000/api/internal/backup-complete
    volumes:
      - recover-backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    # Install the crontab at start, then run busybox crond in the foreground.
    command: sh -c 'echo "30 3 * * * sh /backup.sh" | crontab - && crond -f -l 8'
    depends_on:
      db:
        condition: service_healthy

  # Optional public ingress: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - app

  # Auto-update: polls GHCR every 5 min, restarts app on new image
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    profiles: ["autoupdate"]
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_SCOPE: recover
      DOCKER_API_VERSION: "1.43"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.scope=recover"

volumes:
  recover-db:
  recover-backups:
