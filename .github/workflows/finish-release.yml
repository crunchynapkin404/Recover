name: Finish Release

# The tail of the release. It VERIFIES THE DEPLOY FIRST and tags second, which
# is the inversion 2026-08-20 demanded: scripts/release.sh merged, tagged and
# published a release page while nothing had been built, soaked, promoted or
# deployed, and prod stayed on the previous version. No harm came of it, because
# the final tag builds nothing — but the release page ran ahead of reality,
# which is a cousin of the half-release that script existed to prevent.
#
# runs-on devbox because GitHub's runners cannot reach the prod box, so a green
# promote does not prove a deployed prod. That is the one thing in this pipeline
# that cannot move to a hosted runner.
#
# NEVER add pull_request to this trigger — see docs/RUNNER.md and
# tests/release-gate.test.ts.
#
# The final tag is pushed with the automatic GITHUB_TOKEN, deliberately. A tag
# pushed with it cannot start another workflow run, which is exactly what is
# wanted here: release.yml triggers on `v*-rc.*` only and the final tag must
# build nothing. (release-rc.yml has the opposite requirement and therefore
# needs a PAT.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.115.0"
        required: true
        type: string

permissions:
  contents: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recover

jobs:
  finish:
    runs-on: [self-hosted, devbox]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: The CHANGELOG section must exist before anything is tagged
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if ! grep -qE "^## ${tag//./\\.} " CHANGELOG.md; then
            echo "::error::No '## $tag …' section in CHANGELOG.md."
            echo "::error::Release notes are the CHANGELOG section, never the"
            echo "::error::auto-generated PR list."
            exit 1
          fi

      - name: The tag must not already exist
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the promoted digest
        id: digest
        run: |
          set -euo pipefail
          d=$(docker buildx imagetools inspect "$IMAGE_NAME:${{ inputs.version }}" \
            --format '{{.Manifest.Digest}}')
          echo "sha=$d" >> "$GITHUB_OUTPUT"
          echo "::notice title=Promoted digest::$d"

      # Nothing is tagged until prod is OBSERVED running that digest. This is
      # the step release.sh claimed and never performed.
      - name: Prod must be running it
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: scripts/verify-deploy.sh "${{ steps.digest.outputs.sha }}"

      - name: Tag the release commit
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          title=$(awk -v t="^## ${tag//./\\.} " \
            '$0 ~ t {sub(/^## /, ""); print; exit}' CHANGELOG.md)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$title"
          git push origin "$tag"
          echo "::notice title=Tagged::$tag"

      # The release is not finished until this step is done. Steps above leave
      # prod running the new image, which makes the release FEEL complete — that
      # is precisely why this is the step that gets skipped. It was skipped for
      # v0.28.0, v0.28.1, v0.29.0, v0.30.0, and again for v0.112.0 and v0.113.0
      # on 2026-08-19, both of which shipped to production with no release page
      # until someone asked where the notes were. It is inside this workflow so
      # it cannot be skipped separately.
      - name: Create the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          notes=$(mktemp)
          awk -v start="^## ${tag//./\\.} " '
            $0 ~ start {f=1; next}
            /^## v/ {f=0}
            f
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::Empty release notes for $tag."
            exit 1
          fi
          title=$(awk -v t="^## ${tag//./\\.} " \
            '$0 ~ t {sub(/^## /, ""); print; exit}' CHANGELOG.md)
          gh release create "$tag" --title "$title" --notes-file "$notes"
          echo "::notice title=Released::$tag — release page created."

      # A final tag on a commit older than the v0.105.1 trigger fix resurrects
      # the old ["v*"] trigger from the TAGGED REF and starts a rebuild that
      # would overwrite the promoted digest. It happened on v0.105.0 and was
      # caught queued. Confirm nothing started.
      - name: Nothing may have started building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sleep 15
          started=$(gh run list --workflow release.yml --limit 5 \
            --json status,headBranch \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$started" != "0" ]; then
            echo "::error::release.yml has $started run(s) in flight after the"
            echo "::error::final tag. Cancel them before watchtower moves prod."
            gh run list --workflow release.yml --limit 5
            exit 1
          fi
          echo "release.yml did not fire — correct, the final tag builds nothing."
