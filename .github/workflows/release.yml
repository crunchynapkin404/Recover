name: Release

# ONLY pre-release tags build. This is the hole v0.105.1 closed, and it made
# the whole v0.104.0 gate ineffective on its very first release.
#
# The old trigger was `["v*"]`, so the FINAL `vX.Y.Z` tag — pushed after
# promotion purely to make the repository and the registry agree — re-entered
# this workflow, rebuilt the image from source, and moved `:latest` to a brand
# new digest. That discarded the digest promote.yml had just published: the one
# that was actually soaked on the dev box. Watchtower then deployed the
# rebuild. Prod spent the night running bytes nothing had ever run.
#
# Nothing detected it because everything looked right: CI was green, the
# rebuild came from the same commit, and both `promote.yml` and
# `live-verify-deploy.sh` had already passed before the final tag was pushed.
#
# So the final tag now builds nothing. It marks the commit, and that is all it
# needs to do — `promote.yml` already published `:X.Y.Z` by retagging the
# soaked digest. `tests/release-gate.test.ts` pins this trigger.
on:
  push:
    tags: ["v*-rc.*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recover

permissions:
  contents: read
  packages: write

jobs:
  # The tag is the release: whatever it points at is what watchtower-equipped
  # servers will run. RELEASING.md has always required a green `main` before
  # tagging, but nothing enforced it — v0.63.0 and v0.64.0 were both tagged
  # from a commit whose CI had already failed, and release.yml published the
  # image regardless because it never looks at test results. This job makes
  # the written rule mechanical.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a green CI run for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CI may still be in flight when the tag lands, so wait rather than
          # racing it. 30 × 30s = 15 minutes, comfortably past a ~4min run.
          for attempt in $(seq 1 30); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "pending") \(.html_url)"' 2>/dev/null || true)

            if [ -z "$run" ] || [ "$run" = "null pending null" ]; then
              echo "::error::No CI run found for $SHA. The tag must point at a commit CI has actually tested."
              exit 1
            fi

            status=${run%% *}
            rest=${run#* }
            conclusion=${rest%% *}
            url=${rest#* }

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI green for $SHA — $url"
                exit 0
              fi
              echo "::error::CI concluded '$conclusion' for $SHA — refusing to publish. $url"
              echo "::error::Fix main, then move the tag deliberately (see docs/RELEASING.md)."
              exit 1
            fi

            echo "CI is $status for $SHA (attempt $attempt/30) — waiting 30s. $url"
            sleep 30
          done

          echo "::error::Timed out waiting for CI to finish on $SHA. Not publishing."
          exit 1

  # Build each architecture natively (no QEMU) and push it to GHCR by
  # digest only (untagged). Matrix instead of two hand-duplicated jobs so
  # the build steps stay a single source of truth across archs; the only
  # per-leg difference is which native runner and platform is used.
  build:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set platform pair for artifact naming
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      # Deliberately still v4 while checkout/setup-node moved to v7 (v0.96.0).
      # This pair carries the digest hand-off between the two matrix build
      # legs and the manifest merge below, and the only way to verify a major
      # bump is a real tag push — a green PR proves nothing about it. Bump it
      # on its own, in a release where a broken image is expected and watched.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the amd64 + arm64 digests into one multi-arch manifest under
  # the real release tags (semver + auto `:latest`). Needs both matrix
  # legs to have succeeded before it can reference their digests.
  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          digest_refs=()
          for f in *; do
            digest_refs+=("${{ env.IMAGE_NAME }}@sha256:$f")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

      - name: Inspect pushed manifest
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
