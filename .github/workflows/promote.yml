name: Promote

# Promotion is the ONLY thing that moves :latest, and therefore the only thing
# that deploys to the athlete's instance — prod's watchtower polls :latest every
# 300s and follows nothing else.
#
# It retags a digest that was already built, published and soaked on the dev box
# as a -rc.N pre-release. It never builds. A rebuilt image is not the artifact
# that was tested: `npm ci` resolution and base-image drift are small risks, but
# they are exactly the risks a soak exists to eliminate, and a soak that does
# not test the shipped bytes is theatre.
#
# Rollback uses this same workflow — dispatch it with rc_tag set to a previous
# release's tag. READ docs/RELEASING.md FIRST: rolling the image back does not
# roll the schema back, and whether that is safe depends on whether the
# migrations since the target were additive or destructive.

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Tested tag to promote, e.g. 0.104.0-rc.1"
        required: true
        type: string
      release_tag:
        description: "Release tag to publish alongside :latest, e.g. 0.104.0"
        required: true
        type: string
      capture_run:
        description: "Run ID of the Soak whose capture you opened"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recover

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # THE ONE HUMAN STEP IN THE RELEASE PATH.
      #
      # Two of v0.114.0's four worst defects were invisible to 2,854 tests AND
      # to a clean `0 confirmed` axe report: race one lost its taper on every
      # two-race plan, and the recovery bridge rendered merged with the
      # athlete's ordinary easy weeks. One was found by running the code, the
      # other by opening a screenshot. A pipeline finds neither, and a pipeline
      # that captures 108 PNGs and reports 0 confirmed is exactly the state
      # both of them hid behind.
      #
      # This step cannot verify that a person looked at the PNGs. It verifies
      # that the run they named is real, passed, and captured THIS candidate —
      # which closes the fabrication gap. What remains is someone typing a real
      # run id without opening it: a decision by a person rather than an
      # accident by a pipeline, and preserving that distinction is the point.
      - name: The named capture must exist, have passed, and be this candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.capture_run }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail

          # Test gh's EXIT CODE, not its output. On a 404 `gh api --jq` writes
          # the raw error body to stdout without applying the filter, so a
          # `[ -z "$run" ]` check passes straight through and the run id ends
          # up compared against a JSON blob — it still fails closed, but it
          # reports `Run X is '{"message":"Not Found"...}'`, which is a
          # miserable thing to read halfway through a release.
          if ! run=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '"\(.name)|\(.status)|\(.conclusion // "pending")"' 2>/dev/null); then
            echo "::error::No run $RUN_ID in $REPO. capture_run must be a Soak run id."
            exit 1
          fi

          name=${run%%|*}; rest=${run#*|}
          status=${rest%%|*}; conclusion=${rest#*|}

          if [ "$name" != "Soak" ]; then
            echo "::error::Run $RUN_ID is '$name', not 'Soak'."
            exit 1
          fi
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Soak $RUN_ID is $status/$conclusion — not a passed soak."
            exit 1
          fi

          want="soak-capture-$RC_TAG"
          if ! names=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[].name' 2>/dev/null); then
            echo "::error::Could not list artifacts for run $RUN_ID."
            exit 1
          fi
          if ! grep -qx "$want" <<< "$names"; then
            echo "::error::Soak $RUN_ID has no artifact named '$want'."
            echo "::error::That run captured a different candidate than $RC_TAG."
            exit 1
          fi

          echo "::notice title=Capture::$want from run $RUN_ID — promoting."

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the digest :latest points at now
        run: |
          set -euo pipefail
          before=$(docker buildx imagetools inspect "$IMAGE_NAME:latest" \
            --format '{{.Manifest.Digest}}' 2>/dev/null || echo none)
          echo "ROLLBACK_DIGEST=$before" >> "$GITHUB_ENV"
          echo "::notice title=Rollback target::$before — record this in docs/ENVIRONMENTS.md"

      - name: Promote the soaked digest
        run: |
          set -euo pipefail
          rc="$IMAGE_NAME:${{ inputs.rc_tag }}"
          digest=$(docker buildx imagetools inspect "$rc" --format '{{.Manifest.Digest}}')
          echo "::notice title=Promoting::$rc is $digest"
          docker buildx imagetools create \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ inputs.release_tag }}" \
            "$IMAGE_NAME@$digest"

      - name: Verify :latest now points at exactly that digest
        run: |
          set -euo pipefail
          after=$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{.Manifest.Digest}}')
          want=$(docker buildx imagetools inspect "$IMAGE_NAME:${{ inputs.rc_tag }}" --format '{{.Manifest.Digest}}')
          if [ "$after" != "$want" ]; then
            echo "::error::promotion did not land — :latest is $after, expected $want"
            exit 1
          fi
          echo "::notice title=Promoted::latest = $after (was $ROLLBACK_DIGEST)"
          echo "Now run scripts/live-verify-deploy.sh $after on devbox — this"
          echo "workflow cannot reach the prod box and so cannot confirm the deploy."
